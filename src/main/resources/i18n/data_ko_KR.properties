plugin.ai.consent.message=AI will send the locally filtered Git Diff for files included in the current Commit window to your configured remote AI service. The Diff may contain code and text.\n\nThe plugin does not send unselected files or scan the entire workspace. Review the data before sending. Binary files, built-in sensitive-file rules, and your exclusion rules are applied, but they cannot identify every sensitive value. Configure exclusions for private keys, credentials, tokens, environment files, customer data, generated files, and anything that must remain local.\n\nThis feature only generates a commit-message suggestion. It never commits, pushes, stages, or modifies code. Your chosen AI provider determines privacy, retention, and cross-border data handling; confirm that it meets your compliance requirements.
