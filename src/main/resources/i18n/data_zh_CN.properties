plugin.ai.consent.message=AI 功能会将当前 Commit 窗口中已勾选文件的、经过本地筛选后的 Git Diff（可能包含代码与文本内容）发送至您配置的远程 AI 服务。\n\n插件不会发送未勾选文件，也不会扫描整个工作区；但请在发送前检查将传输的内容。插件会排除二进制、内置敏感文件和排除规则匹配的文件，但无法保证识别所有敏感信息。建议在 AI 模型设置中排除私钥、凭据、令牌、环境变量、客户数据、生成文件及其他不应离开本机的文件。\n\n此功能仅生成提交信息建议，不会执行 Git 提交、推送、暂存或修改代码。AI 服务的隐私政策、数据保留和跨境传输由您选择的服务商决定，请自行确认合规性。
plugin.ai.consent.accept=同意并继续
