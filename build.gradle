plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '1.17.4'
}

group = providers.gradleProperty('pluginGroup').get()
version = providers.gradleProperty('pluginVersion').get()

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    maven {
        url 'https://maven.aliyun.com/repository/public/'
    }
    maven {
        url 'https://maven.aliyun.com/repository/spring/'
    }
    mavenLocal()
    mavenCentral()
}

intellij {
    version = providers.gradleProperty('platformVersion').get()
    type = providers.gradleProperty('platformType').get()
    plugins = ['Git4Idea']

    downloadSources = true
    updateSinceUntilBuild = false
    buildSearchableOptions.enabled = false
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.0'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// `-Pchannel` takes precedence; the convenience tasks select their matching channel.
def buildChannel = providers.gradleProperty('channel').getOrElse(
        gradle.startParameter.taskNames.any { it.endsWith('buildAlpha') } ? 'Alpha' :
                gradle.startParameter.taskNames.any { it.endsWith('buildStable') } ? 'Stable' : 'Release'
)
def buildTime = new Date().format('yyyyMMddHHmm')
def generatedResourcesDir = layout.buildDirectory.dir('generated-resources/main')

tasks.register('generateBuildInfo') {
    outputs.file(generatedResourcesDir.map { it.file('version.properties') })

    doLast {
        def properties = new Properties()
        properties.setProperty('pluginVersion', project.version.toString())
        properties.setProperty('javaVersion', providers.gradleProperty('javaVersion').get())
        properties.setProperty('platformVersion', providers.gradleProperty('platformVersion').get())
        properties.setProperty('platformType', providers.gradleProperty('platformType').get())
        properties.setProperty('channelCode', buildChannel)
        properties.setProperty('builderTime', buildTime)

        def output = generatedResourcesDir.get().file('version.properties').asFile
        output.parentFile.mkdirs()
        output.withOutputStream { properties.store(it, null) }
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('generateBuildInfo')
    // 仅排除源码目录中的静态版本文件，保留构建生成的版本信息进入插件 JAR。
    exclude { details -> details.file == file('src/main/resources/version.properties') }
    from(generatedResourcesDir)
}

tasks.named('buildPlugin') {
    archiveFileName.set("${rootProject.name}-${project.version}-${buildChannel.toLowerCase()}(${buildTime}).zip")
}

def registerChannelBuild = { String taskName, String channel ->
    tasks.register(taskName) {
        group = 'ct-idea-plugin'
        description = "构建${channel}版本"
        dependsOn tasks.named('clean')
        finalizedBy tasks.named('buildPlugin')
    }
}

registerChannelBuild('buildStable', 'Stable')
registerChannelBuild('buildAlpha', 'Alpha')
